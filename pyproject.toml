[project]
name = "servicenow-universal-mcp"
version = "1.0.0"
description = "Универсальный MCP-сервер для ServiceNow — подключает любую LLM (OpenAI, Anthropic, DeepSeek, Ollama, OpenRouter) к ServiceNow через Model Context Protocol"
authors = [
    {name = "Vlady", email = "vladarchitect@github"}
]
license = {text = "AGPL-3.0"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
keywords = ["servicenow", "mcp", "llm", "ai", "itsm", "model-context-protocol", "automation"]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
deepseek = ["openai>=1.0.0"]
ollama = ["ollama>=0.4.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "ollama>=0.4.0",
]

[project.scripts]
sn-mcp = "mcp_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
