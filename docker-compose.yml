# ServiceNow Universal MCP — Docker Compose
#
# Usage:
#   1. Copy .env.example → .env and fill in credentials
#   2. docker compose up -d
#   3. Server available at http://localhost:8000

version: "3.9"

services:
  mcp-server:
    build: .
    container_name: sn-mcp-server
    restart: unless-stopped
    ports:
      - "${MCP_SERVER_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"

  # Optional: OpenTelemetry collector for observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: sn-otel-collector
    restart: unless-stopped
    profiles: ["observability"]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/otel-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - mcp-server
